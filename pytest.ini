[pytest]
# Suppress warnings from AI dependencies
filterwarnings =
    ignore::DeprecationWarning:spacy
    ignore::DeprecationWarning:nltk
    # Ignore Qt font warning when no GUI is available
    ignore:.*QGuiApplication.*:UserWarning

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    ai: marks tests requiring AI dependencies